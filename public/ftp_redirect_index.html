<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomerBD - Redirection</title>
    <!-- Redirection immédiate par balise meta -->
    <meta http-equiv="refresh" content="0; url=https://homerbd.lovable.app">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 20px;
            max-width: 500px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #3b82f6;
        }
        p {
            font-size: 16px;
            color: #94a3b8;
        }
        a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
        .loader {
            border: 3px solid #1e293b;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Redirection en cours...</h1>
        <div class="loader"></div>
        <p>Vous allez être redirigé vers le nouveau site :</p>
        <p><a href="https://homerbd.lovable.app">homerbd.lovable.app</a></p>
        <p>Si la redirection ne fonctionne pas, cliquez sur le lien ci-dessus.</p>
    </div>

    <!-- Redirection de secours en JavaScript -->
    <script>
        setTimeout(function() {
            window.location.href = "https://homerbd.lovable.app";
        }, 100);
    </script>
</body>
</html>
